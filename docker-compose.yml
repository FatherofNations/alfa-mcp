services:
  alfa-mcp:
    build: .
    container_name: alfa-mcp
    restart: unless-stopped
    expose:
      - "8811"
    environment:
      - PROTO_HTTP_PORT=8811
      # Bearer-токен для /mcp (пусто = без аутентификации).
      # Задаётся в .env рядом с этим файлом: PROTO_AUTH_TOKEN=...
      - PROTO_AUTH_TOKEN=${PROTO_AUTH_TOKEN:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8811/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      # редирект HTTP -> HTTPS
      - "traefik.http.middlewares.pf-redirect-https.redirectscheme.scheme=https"

      # HTTP
      - "traefik.http.routers.pf-http.rule=Host(`alfa-mcp.leggit.ru`)"
      - "traefik.http.routers.pf-http.entrypoints=web"
      - "traefik.http.routers.pf-http.middlewares=pf-redirect-https"
      - "traefik.http.routers.pf-http.service=pf-svc"

      # HTTPS
      - "traefik.http.routers.pf-https.rule=Host(`alfa-mcp.leggit.ru`)"
      - "traefik.http.routers.pf-https.entrypoints=websecure"
      - "traefik.http.routers.pf-https.tls.certresolver=myresolver"
      - "traefik.http.routers.pf-https.service=pf-svc"

      # сервис: внутренний порт 8811
      - "traefik.http.services.pf-svc.loadbalancer.server.port=8811"
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: proxy
